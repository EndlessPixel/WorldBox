name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: '手动创建新版本号（如 1.2.3）；留空则覆盖 latest 发布'
        required: false
        type: string

permissions:
  contents: write

env:
  FONT_URL: https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/SubsetOTF/SC/NotoSansSC-Regular.otf
  LICENSE_URL: https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/LICENSE

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装运行与打包依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: 应用手动版本号
        if: inputs.version != ''
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python set_version.py

      - name: 下载中文字体与 OFL 许可
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path assets/fonts | Out-Null
          Invoke-WebRequest -Uri "$env:FONT_URL" -OutFile "assets/fonts/NotoSansSC-Regular.otf"
          Invoke-WebRequest -Uri "$env:LICENSE_URL" -OutFile "assets/fonts/OFL.txt"

      - name: PyInstaller 打包 exe
        run: python build_exe.py

      - name: 启动自检（无显示器环境可能受限）
        continue-on-error: true
        shell: pwsh
        run: |
          $resultFile = "dist/WorldBox/smoke_result.txt"
          Remove-Item -ErrorAction SilentlyContinue $resultFile
          $p = Start-Process -FilePath "dist/WorldBox/WorldBox.exe" `
            -ArgumentList "--smoke" -WorkingDirectory "dist/WorldBox" -PassThru
          $p.WaitForExit(90000) | Out-Null
          if (Test-Path $resultFile) {
            $result = Get-Content $resultFile -Raw
            Write-Host "smoke result: $result"
            if ($result -notmatch '^OK') { exit 1 }
          } else {
            Write-Host "smoke: no result file (headless window limitation)"
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }
          Remove-Item -ErrorAction SilentlyContinue $resultFile

      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/*.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装 AppImage 运行依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64

      - name: 安装运行与打包依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: 应用手动版本号
        if: inputs.version != ''
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python set_version.py

      - name: 下载中文字体与 OFL 许可
        run: |
          mkdir -p assets/fonts
          curl -fsSL "$FONT_URL" -o assets/fonts/NotoSansSC-Regular.otf
          curl -fsSL "$LICENSE_URL" -o assets/fonts/OFL.txt

      - name: Briefcase 打包 AppImage
        run: python build_appimage.py

      - uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 汇总产物
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.zip' -o -name '*.AppImage' \) -exec cp {} release/ \;
          ls -lh release

      - name: 生成发布说明
        env:
          MANUAL_VERSION: ${{ inputs.version || '' }}
        run: |
          if [ -n "$MANUAL_VERSION" ]; then
            VERSION="${MANUAL_VERSION#v}"
          else
            VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['tool']['briefcase']['version'])")
          fi
          python make_release_notes.py --version "$VERSION" --files release/* --output RELEASE_NOTES.md

      - name: 发布（默认覆盖 latest）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_VERSION: ${{ inputs.version || '' }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash publish_release.sh
